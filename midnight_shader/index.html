<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shader WebGL2</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

if (!gl) { document.body.innerHTML = 'WebGL2 not supported'; }

// Resize canvas
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// Mouse tracking
const mouse = { x: 0, y: 0, z: 0, w: 0 };
let mouseDown = false;
let paused = false;
document.addEventListener('keydown', (e) => {
  if(e.key == ' '){
    paused = !paused;
    if(!paused){
      requestAnimationFrame(render);
    }
  };
});
canvas.addEventListener('mousedown', () => mouseDown = true);
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = canvas.height - e.clientY;
  if (mouseDown) { mouse.z = e.clientX; mouse.w = canvas.height - e.clientY; }
});

// Compile shader
function compileShader(source, type) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

// Full-screen quad
const vertices = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);

// VAO for WebGL2
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

// Uniforms
let uniforms;
let startTime, frame, lastTime;

function initProgram(fsSource) {
  const vs = compileShader(`#version 300 es
    in vec2 position;
    void main() { gl_Position = vec4(position, 0.0, 1.0); }
  `, gl.VERTEX_SHADER);

  const fs = compileShader(`#version 300 es
    precision highp float;
    uniform vec3 iResolution;
    uniform float iTime;
    uniform float iTimeDelta;
    uniform int iFrame;
    uniform vec4 iMouse;
    uniform vec4 iDate;
    uniform float iSampleRate;
    out vec4 fragColor;
    ${fsSource}
    void main() { mainImage(fragColor, gl_FragCoord.xy); }
  `, gl.FRAGMENT_SHADER);

  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return;
  }

  gl.useProgram(program);

  gl.bindVertexArray(vao);

  const posLoc = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  uniforms = {
    iResolution: gl.getUniformLocation(program, 'iResolution'),
    iTime: gl.getUniformLocation(program, 'iTime'),
    iTimeDelta: gl.getUniformLocation(program, 'iTimeDelta'),
    iFrame: gl.getUniformLocation(program, 'iFrame'),
    iMouse: gl.getUniformLocation(program, 'iMouse'),
    iDate: gl.getUniformLocation(program, 'iDate'),
    iSampleRate: gl.getUniformLocation(program, 'iSampleRate'),
  };

  startTime = performance.now();
  frame = 0;
  lastTime = startTime;
  render();
}

function render() {
  if(paused){
    return;
  }
  const now = performance.now();
  const time = (now - startTime) / 1000;
  const delta = (now - lastTime) / 1000;
  lastTime = now;

  const date = new Date();

  gl.uniform3f(uniforms.iResolution, canvas.width, canvas.height, 1.0);
  gl.uniform1f(uniforms.iTime, time);
  gl.uniform1f(uniforms.iTimeDelta, delta);
  gl.uniform1i(uniforms.iFrame, frame);
  gl.uniform4f(uniforms.iMouse, mouse.x, mouse.y, mouse.z, mouse.w);
  gl.uniform4f(uniforms.iDate, date.getFullYear(), date.getMonth(), date.getDate(), date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds());
  gl.uniform1f(uniforms.iSampleRate, 44100.0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  frame++;
  requestAnimationFrame(render);
}

fetch('cewl3.glsl')
  .then(r => { if (!r.ok) throw new Error('Failed to load shader'); return r.text(); })
  .then(initProgram)
  .catch(e => console.error(e));
</script>
</body>
</html>
