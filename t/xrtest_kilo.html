<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>xrtest_kilo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    .overlay {
      position: fixed; top: 1rem; left: 1rem; z-index: 99;
      background: rgba(15, 23, 42, 0.85); padding: 1rem 1.5rem;
      border-radius: 10px; border: 1px solid #334155;
      backdrop-filter: blur(6px);
    }
    .overlay h1 { margin: 0 0 0.25rem; font-size: 1.1rem; color: #93c5fd; }
    .overlay p { margin: 0; font-size: 0.85rem; color: #94a3b8; }
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <div class="overlay">
    <h1>xrtest_kilo</h1>
    <p>Click the VR goggles icon (bottom-right) to enter immersive mode.</p>
  </div>

  <a-scene>
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#1e293b"></a-plane>
    <a-box position="-1.5 0.5 -3" color="#ef4444"></a-box>
    <a-sphere position="0 1.25 -3" radius="0.75" color="#3b82f6"></a-sphere>
    <a-cylinder position="1.5 0.75 -3" radius="0.5" height="1.5" color="#22c55e"></a-cylinder>
    <a-sky color="#0f172a"></a-sky>
  </a-scene>
</body>
</html>
